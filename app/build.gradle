plugins {
    id 'com.android.application'
}

android {
    namespace 'com.animales.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.animales.app"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
